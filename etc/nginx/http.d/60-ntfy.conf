server {
	listen 4443 ssl;
	http2 on;
	server_name _;
	include /etc/nginx/http.d/snippets/ssl-common.inc;
	
	location / {
		proxy_pass http://ntfy_backend;
		include /etc/nginx/http.d/snippets/proxy-common.inc;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_buffering off;
	}
}
